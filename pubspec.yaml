name: eslam_s_application
description: A new Flutter project.

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <3.7.0"
# ... (other existing configurations like name, description, version, environment)
flutter_launcher_icons:
  android: true # Set to true to generate icons for Android
  ios: true # Set to true to generate icons for iOS
  image_path: "assets/images/app_launcher.png" # Path to your 1024x1024 PNG image
  # Optional: Add adaptive icon foreground/background for Android (API 26+)
  # You can create these layers or use a solid color.
  # android_foreground: "assets/app_icon_foreground.png"
  #android_background: "#000000" # Or "assets/app_icon_background.png"
  # min_sdk_android: 21 # Minimum Android SDK version (default is 21)
  # web:
  #   generate: true
  #   image_path: "assets/app_icon_web.png"
  #   background_color: "#hexcode"
  #   theme_color: "#hexcode"
  # windows:
  #   generate: true
  #   image_path: "assets/app_icon_windows.png"
  #   icon_size: 48 # min 48, default 48, max 256
  # macos:
  #   generate: true
  #   image_path: "assets/app_icon_macos.png"
flutter_native_splash:
  color: "#ffffff"          
  color_dark: "#000000"    
  image: assets/images/app_launcher.png
  android: true
  ios: true
  fullscreen: true


dependencies:
  cached_network_image: ^3.3.0
  connectivity_plus: ^6.1.4
  loading_animation_widget: ^1.3.0
  easy_localization: ^3.0.7+1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: any
  package_info_plus: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.4
  flutter_svg: ^2.1.0
  hive: ^2.2.3
  url_launcher: ^6.3.0
  hive_flutter: ^1.1.0
  rename: ^3.1.0
  shared_preferences: ^2.5.3
  size_helper: ^2.1.0
  uuid: ^4.5.1
  web: any
  page_transition: ^2.2.1
dev_dependencies:
  build_runner: ^2.3.3
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.0
flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/translations/
    - assets/images/
